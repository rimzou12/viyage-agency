<main class="page">
  <div class="auth-card">
    <h1 class="accent-heading">{{ i18n.t('login.title') }}</h1>
    <p class="tagline">{{ i18n.t('login.tagline') }}</p>

    <form (submit)="$event.preventDefault(); submit(emailInput.value, passwordInput.value)">
      <mat-form-field appearance="outline">
        <mat-label>{{ i18n.t('login.email') }}</mat-label>
        <input matInput #emailInput type="email" required [disabled]="submitting()" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>{{ i18n.t('login.password') }}</mat-label>
        <input matInput #passwordInput type="password" required [disabled]="submitting()" />
      </mat-form-field>
      <button mat-flat-button type="submit" [disabled]="submitting()">
        {{ submitting() ? i18n.t('login.submitting') : i18n.t('login.submit') }}
      </button>
    </form>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <p class="switch">{{ i18n.t('login.noAccount') }} <a routerLink="/register">{{ i18n.t('login.register') }}</a></p>
  </div>
</main>
