<main class="page">
  <div class="auth-card">
    <h1 class="accent-heading">Create an account</h1>
    <p class="tagline">Join the group, pool together, pay less.</p>

    <form (submit)="$event.preventDefault(); submit(nameInput.value, emailInput.value, passwordInput.value)">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput #nameInput type="text" required [disabled]="submitting()" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput #emailInput type="email" required [disabled]="submitting()" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput #passwordInput type="password" required minlength="8" [disabled]="submitting()" />
      </mat-form-field>
      <button mat-flat-button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</main>
