<main class="page">
  <div class="auth-card">
    <h1 class="accent-heading">{{ i18n.t('register.title') }}</h1>
    <p class="tagline">{{ i18n.t('register.tagline') }}</p>

    <form (submit)="$event.preventDefault(); submit(nameInput.value, emailInput.value, passwordInput.value)">
      <mat-form-field appearance="outline">
        <mat-label>{{ i18n.t('register.name') }}</mat-label>
        <input matInput #nameInput type="text" required [disabled]="submitting()" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>{{ i18n.t('register.email') }}</mat-label>
        <input matInput #emailInput type="email" required [disabled]="submitting()" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>{{ i18n.t('register.password') }}</mat-label>
        <input matInput #passwordInput type="password" required minlength="8" [disabled]="submitting()" />
      </mat-form-field>
      <button mat-flat-button type="submit" [disabled]="submitting()">
        {{ submitting() ? i18n.t('register.submitting') : i18n.t('register.submit') }}
      </button>
    </form>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <p class="switch">
      {{ i18n.t('register.haveAccount') }} <a routerLink="/login">{{ i18n.t('register.logIn') }}</a>
    </p>
  </div>
</main>
