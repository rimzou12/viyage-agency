<mat-toolbar class="nav">
  <a class="brand gradient-text" routerLink="/">Agency Voyage</a>
  <span class="spacer"></span>
  <div class="account">
    @if (auth.isLoggedIn()) {
      <span class="hello">Hi, {{ auth.currentUser()?.displayName }}</span>
      <button mat-stroked-button type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Log out
      </button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register" mat-flat-button class="register">Register</a>
    }
  </div>
</mat-toolbar>

<router-outlet />
