<main class="page">
  <h1>Create an account</h1>

  <form (submit)="$event.preventDefault(); submit(nameInput.value, emailInput.value, passwordInput.value)">
    <label>
      Name
      <input #nameInput type="text" required [disabled]="submitting()" />
    </label>
    <label>
      Email
      <input #emailInput type="email" required [disabled]="submitting()" />
    </label>
    <label>
      Password
      <input #passwordInput type="password" required minlength="8" [disabled]="submitting()" />
    </label>
    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account...' : 'Create account' }}
    </button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
</main>
